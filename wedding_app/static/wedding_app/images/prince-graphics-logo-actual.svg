<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Stylized house/building shape -->
  <polygon points="100,40 150,70 150,160 50,160 50,70" fill="#FFA500" />
  <polygon points="100,40 75,55 75,75 50,90 50,160 100,160 100,90 125,75 125,55" fill="#FF8C00" />
  
  <!-- Windows -->
  <rect x="75" y="100" width="10" height="10" fill="#FFFFFF" />
  <rect x="95" y="100" width="10" height="10" fill="#FFFFFF" />
  <rect x="115" y="100" width="10" height="10" fill="#FFFFFF" />
  <rect x="75" y="120" width="10" height="10" fill="#FFFFFF" />
  <rect x="95" y="120" width="10" height="10" fill="#FFFFFF" />
  <rect x="115" y="120" width="10" height="10" fill="#FFFFFF" />
  <rect x="75" y="140" width="10" height="10" fill="#FFFFFF" />
  <rect x="115" y="140" width="10" height="10" fill="#FFFFFF" />
  
  <!-- Door -->
  <rect x="95" y="140" width="10" height="20" fill="#FFFFFF" />
  
  <!-- Dripping effect -->
  <path d="M60,90 L60,105 L65,100 L70,110 L75,105" fill="#FFA500" stroke="#FFA500" stroke-width="2" />
  <path d="M130,75 L130,90 L135,85 L140,95 L145,85" fill="#FFA500" stroke="#FFA500" stroke-width="2" />
  
  <!-- Text -->
  <text x="55" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFA500">PRINCE GRAPHICS</text>
</svg>
